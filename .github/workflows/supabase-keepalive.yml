name: Supabase keep-alive

# Supabase pauses free-tier projects after a week without activity, which
# leaves the site without doctors or blog posts. Ping it once a day.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (queries Supabase)
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            https://www.domasculptcenter.com/api/health

      # GitHub disables scheduled workflows in public repos after 60 days
      # without commits. Re-enabling the workflow on every run resets that timer.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
